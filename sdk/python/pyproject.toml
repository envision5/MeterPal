[project]
name = "meterpal"
version = "0.1.0"
description = "MeterPal — PayPal-native AI usage billing SDK (Python client + LiteLLM hook)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "MeterPal contributors" }]
keywords = ["paypal", "ai", "billing", "metering", "litellm", "usage-based-pricing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
litellm = ["litellm>=1.60"]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.urls]
Homepage = "https://github.com/craig/meterpal"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meterpal"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
